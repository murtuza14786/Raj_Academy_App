plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.raj_academy"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID.
        applicationId = "com.example.raj_academy"
        // Increase minSdk to meet firebase_auth requirement
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FlutterFire / native Firebase SDK dependencies are pulled in via the Flutter plugins.
    // Do not add Firebase Android dependencies manually here for normal Flutter plugin usage.
}

/*
 APPLY the Google Services plugin at the bottom of the file.
 This reads android/app/google-services.json and wires Firebase into the native Android build.
*/
apply plugin: 'com.google.gms.google-services'
